# pnpm-Workspace der Shop-Plattform (Architektur 6.1, Sicherheit 5.11)
packages:
  - apps/*
  - modules/*
  - packages/*

# --- Lieferkette (Sicherheit 5.11, SIC-08) ---
# Neue Paketversionen erst nach 7 Tagen (Angabe in Minuten).
minimumReleaseAge: 10080
# Fehlt das Veröffentlichungsdatum, wird nicht installiert statt geraten.
minimumReleaseAgeStrict: true
# Abbrechen, wenn ein Paket plötzlich mit weniger Herkunftsnachweisen erscheint als früher.
trustPolicy: no-downgrade
# Unterabhängigkeiten nur aus der Registry, nie direkt aus Git oder von Adressen.
blockExoticSubdeps: true
# Installationsskripte fremder Pakete nur nach ausdrücklicher Freigabe.
strictDepBuilds: true
# Abgelehnt (Testcontainers): ssh2 und cpu-features bauen nur optionale Beschleuniger,
# protobufjs prüft nur Versionen. Ohne die Skripte funktioniert alles.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

# --- Sicherheits-Overrides (befristet, Sicherheit 5.11) ---
# Erzwingen korrigierte Versionen, bis die Pakete darüber selbst nachziehen. Nur Versionen unterhalb der
# Korrektur werden ersetzt, damit ein späteres Update der oberen Pakete den Override von allein überflüssig
# macht. Prüfen bei jedem Update von ESLint oder Testcontainers: `pnpm why minimatch glob`.
overrides:
  # GHSA-g3hv-75wg-m249, behoben in 11.0.1: ESLint (10.x), readdir-glob (5.x) und glob (9.x).
  "minimatch@<11.0.1": "^11.0.2"
  # GHSA-3g3m-2fjr-6pw4, behoben in 14.0.2: archiver-utils (Testcontainers).
  "glob@<14.0.2": "^14.0.3"
