# =============================================================================
# Ergänzung für den öffentlichen Testserver (M5, docs/07_Testserver.md).
# Auf dem Server: docker compose -f infra/compose.yaml -f infra/testserver/compose.testserver.yaml
# Alles andere (Härtung, Netze, Dienste) kommt unverändert aus infra/compose.yaml.
# =============================================================================
services:
  caddy:
    # Adresse des Servers (TESTSERVER_DOMAIN); kein Seitenpasswort mehr.
    # Prüfwert des Testpassworts für das Test-Postfach (MAIL_USER, MAIL_PASSWORD_HASH).
    env_file: [/opt/shop-testserver/secrets.env, ./testserver/test-login.env]
    # Auf dem Server von außen erreichbar (lokal nur 127.0.0.1).
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      # Echte Zertifikate und HSTS statt der lokalen Einstellungen.
      - ./testserver/profile.caddy:/etc/caddy/profile.caddy:ro

  # Test-Postfach: Mailpit ohne eigenes Passwort, Caddy prüft davor das Testpasswort (profile.caddy).
  mailpit:
    environment:
      MP_UI_AUTH: !reset null
