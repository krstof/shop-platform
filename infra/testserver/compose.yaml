# =============================================================================
# Docker Compose für den öffentlichen Testserver (docs/07_Testserver.md).
# Liegt auf dem Server unter /opt/shop-testserver und wird nur vom
# GitHub-Ablauf `.github/workflows/testserver.yml` dorthin kopiert.
#
# Härtung wie lokal (infra/compose.yaml): feste Abbilder mit Prüfsumme,
# kein Dienst als Administrator, cap_drop ALL, no-new-privileges,
# Dateisystem nur lesbar. Zurzeit läuft nur Caddy mit Passwortschutz und liefert
# die Vorschau der Storefront als fertige Seiten aus; API und Datenbank folgen.
# =============================================================================
name: shop-testserver

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

volumes:
  caddy-data: {}
  caddy-config: {}

services:
  # Einmaliger Helfer: gibt die Datenordner dem Caddy-Nutzer (UID 1000).
  volume-init:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /v/caddy-data /v/caddy-config"]
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    volumes:
      - caddy-data:/v/caddy-data
      - caddy-config:/v/caddy-config

  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    user: "1000:1000"
    read_only: true
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Domain, Benutzername und Passwort-Prüfwert (bcrypt). Die Datei legt der
    # Einrichtungs-Ablauf mit Rechten 600 an; sie liegt nie im Repository.
    env_file: [secrets.env]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      volume-init: { condition: service_completed_successfully }
