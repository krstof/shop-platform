# Richtet den öffentlichen Testserver ein und aktualisiert ihn (docs/07_Testserver.md).
# Läuft von Hand (Actions → Testserver → Run workflow) und bei jeder Änderung am Programm.
# Der Server liegt bei Oracle Cloud (Always Free, arm64). Seit M5 läuft dort die ganze Plattform
# wie lokal (infra/compose.yaml plus infra/testserver/compose.testserver.yaml); die Abbilder baut
# der Server selbst aus dem Quellstand, den dieser Ablauf hochlädt.
#
# Braucht in den Repository-Einstellungen:
#   Secret   TESTSERVER_SSH_KEY   privater SSH-Schlüssel (Benutzer ubuntu)
#   Secret   TESTSERVER_PASSWORD  Passwort für die Seite (Benutzer: team)
#   Variable TESTSERVER_HOST      öffentliche IP-Adresse
#   Variable TESTSERVER_DOMAIN    optional; sonst <ip-mit-bindestrichen>.sslip.io
name: Testserver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/**
      - modules/**
      - packages/**
      - infra/**
      - db/**
      - .github/workflows/testserver.yml
      - .env.example
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: testserver
  cancel-in-progress: false

jobs:
  setup:
    name: Einrichten und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOST: ${{ vars.TESTSERVER_HOST }}
      DOMAIN_OVERRIDE: ${{ vars.TESTSERVER_DOMAIN }}
      CADDY_IMAGE: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
      SITE_USER: team
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quellstand verpacken
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
          echo "Quellstand $(git rev-parse --short HEAD): $(du -h "$RUNNER_TEMP/source.tar.gz" | cut -f1)"

      - name: Einstellungen prüfen
        env:
          SSH_KEY: ${{ secrets.TESTSERVER_SSH_KEY }}
          SITE_PASSWORD: ${{ secrets.TESTSERVER_PASSWORD }}
        run: |
          ok=1
          [ -n "$HOST" ] || { echo "::error::Variable TESTSERVER_HOST fehlt."; ok=0; }
          [ -n "$SSH_KEY" ] || { echo "::error::Secret TESTSERVER_SSH_KEY fehlt."; ok=0; }
          [ -n "$SITE_PASSWORD" ] || { echo "::error::Secret TESTSERVER_PASSWORD fehlt."; ok=0; }
          if [ -n "$SITE_PASSWORD" ] && [ "${#SITE_PASSWORD}" -lt 16 ]; then
            echo "::error::TESTSERVER_PASSWORD ist kürzer als 16 Zeichen."; ok=0
          fi
          [ "$ok" = 1 ]
          if [ -n "$DOMAIN_OVERRIDE" ]; then domain="$DOMAIN_OVERRIDE"; else domain="${HOST//./-}.sslip.io"; fi
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "Adresse: https://$domain"

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.TESTSERVER_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/testserver
          if [ -s infra/testserver/known_hosts ]; then
            cp infra/testserver/known_hosts ~/.ssh/known_hosts
          else
            # Erster Lauf: Schlüssel des Servers einmal abholen und anzeigen.
            # Danach gehört er nach infra/testserver/known_hosts (feste Prüfung).
            echo "::warning::infra/testserver/known_hosts ist leer, Serverschlüssel wird ungeprüft übernommen."
            ssh-keyscan -T 15 -t ed25519 "$HOST" > ~/.ssh/known_hosts
            echo "Serverschlüssel für infra/testserver/known_hosts:"
            cat ~/.ssh/known_hosts
          fi
          cat >> ~/.ssh/config <<EOF
          Host testserver
            HostName $HOST
            User ubuntu
            IdentityFile ~/.ssh/testserver
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          ssh testserver 'echo "Verbunden mit $(hostname)"'

      - name: Zugangsdaten für die Seite erzeugen
        env:
          SITE_PASSWORD: ${{ secrets.TESTSERVER_PASSWORD }}
          ASSISTANT_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          hash="$(docker run --rm --network none "$CADDY_IMAGE" caddy hash-password --plaintext "$SITE_PASSWORD")"
          echo "::add-mask::$hash"
          {
            echo "TESTSERVER_DOMAIN='$DOMAIN'"
            echo "TESTSERVER_USER='$SITE_USER'"
            echo "TESTSERVER_PASSWORD_HASH='$hash'"
          } > "$RUNNER_TEMP/secrets.env"
          printf '%s' "$SITE_PASSWORD" > "$RUNNER_TEMP/site-password"
          # KI-Assistent (Welle 2): Schlüssel fürs Sprachmodell. Darf fehlen, dann meldet der
          # Assistent „nicht eingerichtet“. Eigene Datei, damit nur die API ihn bekommt.
          printf '%s' "$ASSISTANT_API_KEY" > "$RUNNER_TEMP/assistant-key"

      - name: Server einrichten
        run: |
          upload=/tmp/shop-testserver-upload
          ssh testserver "rm -rf $upload && mkdir -m 700 $upload"
          scp -q infra/testserver/setup.sh "$RUNNER_TEMP/secrets.env" "$RUNNER_TEMP/site-password" \
            "$RUNNER_TEMP/assistant-key" "$RUNNER_TEMP/source.tar.gz" "testserver:$upload/"
          rm -f "$RUNNER_TEMP/secrets.env" "$RUNNER_TEMP/site-password" "$RUNNER_TEMP/assistant-key"
          ssh testserver "sudo bash $upload/setup.sh; rc=\$?; rm -rf $upload; exit \$rc"

      - name: Rauchtest
        env:
          SITE_PASSWORD: ${{ secrets.TESTSERVER_PASSWORD }}
        run: |
          url="https://$DOMAIN/"
          # Die Zertifikate können beim ersten Start ein paar Minuten brauchen.
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://shop.$DOMAIN/" || true)"
            [ "$code" = 200 ] && break
            echo "Versuch $i: $code"; sleep 10
          done
          [ "$code" = 200 ] || { echo "::error::Shops: erwartet 200, bekommen $code"; exit 1; }
          # Startseite leitet zu den Shops weiter, HTTP leitet auf HTTPS um.
          loc="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "$url")"
          [ "$loc" = "308 https://shop.$DOMAIN/" ] || { echo "::error::Startseite: $loc"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://shop.$DOMAIN/")"
          case "$code" in 301|308) ;; *) echo "::error::HTTP sollte auf HTTPS umleiten, bekommen $code"; exit 1 ;; esac
          curl -sI --max-time 10 "https://shop.$DOMAIN/teeladen" \
            | grep -qi '^strict-transport-security:' || { echo "::error::HSTS-Header fehlt"; exit 1; }
          auth=(-s --max-time 20)
          expect() { # expect CODE URL [curl-Optionen …]
            local want="$1" u="$2"; shift 2
            local got; got="$(curl "$@" -o /dev/null -w '%{http_code}' "$u" || true)"
            [ "$got" = "$want" ] || { echo "::error::$u: erwartet $want, bekommen $got"; exit 1; }
          }
          # Shops (M4): Teeladen mit Produkten und Bildern
          shop="https://shop.$DOMAIN"
          for i in $(seq 1 30); do
            code="$(curl "${auth[@]}" -o /dev/null -w '%{http_code}' "$shop/teeladen" || true)"
            [ "$code" = 200 ] && break
            echo "Shop, Versuch $i: $code"; sleep 10
          done
          page="$(curl "${auth[@]}" "$shop/teeladen")"
          grep -q 'Sencha Frühlingshauch' <<<"$page" || { echo "::error::Teeladen ohne Produkte"; exit 1; }
          img="$(grep -o "https://media.$DOMAIN/[^\"]*w400.webp" <<<"$page" | head -1)"
          [ -n "$img" ] || { echo "::error::Teeladen ohne Bilder"; exit 1; }
          expect 200 "$img" -s --max-time 20
          # Seit 10.11.2026 ohne Seitenpasswort: Shops und Backoffice sind öffentlich.
          expect 200 "$shop/teeladen" -s --max-time 20
          expect 200 "https://admin.$DOMAIN/teeladen/produkte" -s --max-time 20
          expect 404 "$shop/gibt-es-nicht" "${auth[@]}"
          # Backoffice (M3) mit der API unter derselben Adresse.
          expect 200 "https://admin.$DOMAIN/teeladen/produkte" "${auth[@]}"
          session="$(curl "${auth[@]}" "https://admin.$DOMAIN/auth/v1/session")"
          grep -q '"code":"unauthenticated"' <<<"$session" || { echo "::error::Auth-API: $session"; exit 1; }
          # Plattform-Verwaltung (M8): Seite und Platform-API unter derselben Adresse.
          expect 200 "https://admin.$DOMAIN/plattform" -s --max-time 20
          expect 401 "https://admin.$DOMAIN/platform/v1/shops" -s --max-time 20
          # Anmelden: Das Testpasswort kennt nur Kristof (test-login.env enthält nur Prüfwerte).
          # Geprüft wird, dass ein falsches Passwort abgelehnt wird.
          signin="$(curl "${auth[@]}" -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -H "origin: https://admin.$DOMAIN" \
            --data '{"email":"inhaberin@teeladen.example","password":"falsches-passwort-rauchtest"}' \
            "https://admin.$DOMAIN/auth/v1/sign-in")"
          [ "$signin" = 401 ] || { echo "::error::Falsches Passwort: erwartet 401, bekommen $signin"; exit 1; }
          # Test-Postfach nur mit dem Testpasswort.
          expect 401 "https://mail.$DOMAIN/" -s --max-time 20
          ssh testserver 'sudo sshd -T' | grep -qx 'passwordauthentication no' \
            || { echo "::error::SSH nimmt Passwörter an"; exit 1; }
          echo "Alles in Ordnung: https://shop.$DOMAIN/teeladen und https://admin.$DOMAIN"
