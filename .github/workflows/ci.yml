# Automatische Prüfungen bei jedem Push und Pull Request (Architektur 8.3, Sicherheit 7).
# Fremde Actions sind mit der vollständigen Commit-Kennung eingebunden (Sicherheit 5.11).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Astro (Storefront) schickt sonst Nutzungsdaten nach außen.
env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, Lint, Typen, Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ganze Geschichte, damit oasdiff mit dem vorigen Stand vergleichen kann.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm build
      # OpenAPI-Dateien aktuell, jede Operation erklärt ihre Berechtigung (API-03, T-09)
      - run: pnpm openapi --check
      # Bruchprüfung der API gegen den vorigen Stand (Architektur 4.3)
      - name: oasdiff
        env:
          OASDIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash tools/oasdiff.sh
      - run: pnpm test:tools
      - run: pnpm test

  secrets:
    name: Geheimnisse (gitleaks, T-06)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash tools/scan-secrets.sh

  dependencies:
    name: Abhängigkeiten (OSV-Scanner, pnpm audit, T-07)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bash tools/scan-deps.sh

  database:
    name: Datenbank (Migrationen, T-01 bis T-05, T-08, Datenbanktypen, Pakettests, Schemathesis T-12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Jeder Schritt startet per Testcontainers (@shop/testing) eine eigene Wegwerf-Datenbank
      # PostgreSQL 18.6 und richtet sie mit dem Dienst migrate ein.
      # Isolations- und Rechtetest (T-01 bis T-05)
      - run: pnpm test:db
      # Datenbanktypen je Modul müssen zu den Migrationen passen
      - run: pnpm db:types --check
      - run: pnpm test:with-db
      # T-12 kurz: Schemathesis gegen die Admin-API mit echter Datenbank.
      # Feste Versionen mit Prüfsummen (tools/fuzz/requirements.txt), Python 3.12 des Runners.
      - run: python3 -m venv .venv-fuzz && .venv-fuzz/bin/pip install --require-hashes --no-deps -r tools/fuzz/requirements.txt
      - run: pnpm test:fuzz
        env:
          SHOP_SCHEMATHESIS: .venv-fuzz/bin/schemathesis

  infrastructure:
    name: Infrastruktur (Docker Compose, Rauchtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev
      - run: pnpm test:infra
      - if: failure()
        run: docker compose --project-directory infra -f infra/compose.yaml -f infra/compose.local.yaml --env-file .env logs --no-color --tail 100
      - if: always()
        run: pnpm dev:down
