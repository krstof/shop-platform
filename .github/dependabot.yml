# Wöchentliche Update-Vorschläge (Sicherheit 5.11). Claude prüft und übernimmt sie
# im täglichen Lauf. Neue Versionen erst nach 7 Tagen (passend zu minimumReleaseAge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
  # Basisabbild der eigenen Dienste (infra/docker/Dockerfile).
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
